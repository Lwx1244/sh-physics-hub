<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e9c" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="沪上物理后台" />
  <title>管理员后台 · 上海高中物理平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="打开导航">☰</button>
    <div class="logo">管理后台<span>·</span>资料与学情管理</div>
    <div class="spacer"></div>
    <a href="/" target="_blank" class="navlinks"><span style="color:#cfe0ff">前往前台</span></a>
    <button class="btn ghost" id="profileBtn" style="color:#fff;border-color:#5b8de0;display:none">账号设置</button>
    <button class="btn ghost" id="loginBtn" style="color:#fff;border-color:#5b8de0;">管理员登录</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="menu-group"><div class="menu-title" data-tab="upload"><span>📥 资料上传与入库</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="add"><span>➕ 手动新增内容</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="students"><span>👤 学生档案管理</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="errors"><span>📕 错题管理</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="scores"><span>📊 成绩管理</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="bank"><span>🗃 题库管理</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="extract"><span>🔍 文本提取</span></div></div>
      <div class="menu-group"><div class="menu-title" data-tab="papers"><span>🧾 组卷历史</span></div></div>
    </aside>
    <main class="content" id="content"><div class="empty">请登录后操作</div></main>
  </div>

  <div class="modal-mask" id="loginModal" style="display:none;">
    <div class="modal">
      <h3>管理员登录</h3>
      <div class="login-tabs">
        <button class="login-tab active" data-tab="pwd">密码登录</button>
        <button class="login-tab" data-tab="sms">手机号验证登录</button>
      </div>

      <div class="login-pane" id="panePwd">
        <label class="field"><span>用户名</span><input id="lgUser" value="admin"></label>
        <label class="field"><span>密码</span><input id="lgPwd" type="password" value="admin123"></label>
        <button class="btn" id="lgSubmit" style="width:100%">登录</button>
      </div>

      <div class="login-pane" id="paneSms" style="display:none">
        <label class="field"><span>手机号</span><input id="smsPhone" placeholder="请输入绑定手机号" maxlength="11"></label>
        <label class="field sms-row"><span>验证码</span>
          <input id="smsCode" placeholder="6 位验证码" maxlength="6">
          <button class="btn sm" id="smsSend" type="button">获取验证码</button>
        </label>
        <button class="btn" id="smsSubmit" style="width:100%">登录</button>
        <div class="muted sms-tip" id="smsTip"></div>
      </div>

      <div class="err" id="lgErr"></div>
    </div>
  </div>

  <div class="modal-mask" id="profileModal" style="display:none;">
    <div class="modal">
      <h3>账号设置</h3>
      <div class="muted mb" id="profilePhone"></div>
      <label class="field"><span>绑定新手机号</span><input id="newPhone" placeholder="11 位手机号" maxlength="11"></label>
      <button class="btn" id="profileSave" style="width:100%">保存</button>
      <div class="err" id="profileErr"></div>
    </div>
  </div>

  <div class="modal-mask" id="qDetailModal" style="display:none;">
    <div class="modal wide" id="qDetail"></div>
  </div>

  <!-- 浏览器端 OCR（拍照/图片识别文字，需联网加载中文字库；离线时可手动粘贴文本） -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
